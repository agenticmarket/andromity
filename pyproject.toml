[project]
name = "andromity"
version = "0.1.0b1"
description = "The coding agent that never clocks out."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "textual>=3.0",
    "litellm>=1.50",
    "tomli>=2.0; python_version<'3.12'",
    "tomli-w>=1.0",
    "gitpython>=3.1",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
andromity = "andromity.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
