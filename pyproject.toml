[project]
name = "andromity"
version = "0.2.16"
description = "Open-source AI coding agent for terminal and IDE workflows with BYOK, local Ollama, MCP tools and subagents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{ name = "Agentic Market", email = "hello@agenticmarket.dev" }]
keywords = ["ai", "coding-agent", "autonomous-agent", "byok", "ollama", "mcp", "llm", "cli", "tui", "terminal", "code-review", "claude", "openai", "gemini", "openrouter", "subagents"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Terminals",
]

dependencies = [
    "textual>=8.2.8,<9.0",
    "pillow>=10.0",
    "litellm>=1.50,<2.0",
    "tomli>=2.0; python_version<'3.12'",
    "tomli-w>=1.0",
    "gitpython>=3.1",
    "rich>=13.0",
    "click>=8.0",
    "mcp>=1.0.0,<2.0",
    "httpx>=0.28.0",
    "httpx-sse>=0.4.0",
    "watchdog>=3.0",
    "markdownify>=0.14.0",
    "ddgs>=1.0.0",
    "textual-plotext>=0.2.1",
]

[project.urls]
Homepage = "https://agenticmarket.dev"
Repository = "https://github.com/agenticmarket/andromity"
"Bug Tracker" = "https://github.com/agenticmarket/andromity/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
andromity = "andromity.cli:main"
andromity-ci = "andromity.ci.runner:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["andromity*"]

[tool.setuptools.package-data]
andromity = ["assets/sounds/*.wav", "assets/*.ico", "assets/*", "assets/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::ResourceWarning",
]
