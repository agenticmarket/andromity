name = "andromity-telemetry"
account_id = "d26d1b568f27844edae405a0a103c701"
main = "worker.js"
compatibility_date = "2024-03-29"
routes = [
  { pattern = "telemetry.agenticmarket.dev", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "andromity-telemetry"
database_id = "f320f67d-a023-41bf-a56e-079dc23e710d"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# POST /waitlist only, per client IP. Cloudflare rate limits allow a 10 or 60 second period.
[[unsafe.bindings]]
name = "WAITLIST_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[observability]
enabled = true

[observability.logs]
invocation_logs = false
