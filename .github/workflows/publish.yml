name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v0.2.15)'
        required: true
        default: 'v0.2.15'
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate requested tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          tag = os.environ['REQUESTED_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a stable vMAJOR.MINOR.PATCH tag.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: '0.12.23'
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python scripts/check-release.py
      - name: Build source archive and wheel
        run: uv build --no-sources
      - name: Preserve release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Check publishing credential
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo '::error::Add the repository Actions secret PYPI_TOKEN before publishing.'
            exit 1
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          verify-metadata: true
