name: Build Platform Binaries

# Builds andromity-server for each platform and packages a slim, platform-specific
# .vsix for each target. Each .vsix only contains its own platform binary.
#
# VS Code Marketplace / Open VSX accept per-platform .vsix files published with
# `vsce publish --target <platform>` or `ovsx publish --target <platform>`.
#
# Triggers: push of a v* tag  OR  manual workflow_dispatch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build · ${{ matrix.platform_key }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false          # Build all platforms even if one fails
      matrix:
        include:
          - runner: windows-latest
            platform_key: win32-x64
            exe_name: andromity-server.exe

          - runner: ubuntu-latest
            platform_key: linux-x64
            exe_name: andromity-server

          - runner: macos-latest      # GitHub's Apple Silicon (M1/M2/M3) runner
            platform_key: darwin-arm64
            exe_name: andromity-server

    steps:
      # ── Source ────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # ── Python ────────────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python scripts/check-release.py

      # uv avoids PEP 668 "externally-managed-environment" errors on Linux/macOS
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Install Python dependencies
        run: |
          uv pip install -e ".[dev]" --system
          uv pip install pyinstaller --system

      # ── Build binary ──────────────────────────────────────────────────────────
      - name: Build andromity-server binary
        run: python scripts/build-binary.py

      # ── Verify binary ─────────────────────────────────────────────────────────
      - name: Verify binary exists (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN=vscode-extension/bin/${{ matrix.platform_key }}/${{ matrix.exe_name }}
          if [ ! -f "$BIN" ]; then
            echo "ERROR: Binary not found at $BIN"
            ls -la vscode-extension/bin/ || true
            exit 1
          fi
          chmod +x "$BIN"
          echo "Binary size: $(du -sh "$BIN" | cut -f1)"
          "$BIN" --check-runtime

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "vscode-extension/bin/${{ matrix.platform_key }}/${{ matrix.exe_name }}"
          if (-not (Test-Path $bin)) {
            Write-Error "Binary not found at $bin"
            Get-ChildItem vscode-extension/bin/ -ErrorAction SilentlyContinue
            exit 1
          }
          $size = (Get-Item $bin).Length / 1MB
          Write-Output ("Binary size: {0:N1} MB" -f $size)
          & $bin --check-runtime

      # ── Node / Extension build ────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Test extension
        working-directory: vscode-extension
        run: npm run test:build

      - name: Build extension JS bundle
        working-directory: vscode-extension
        run: npm run build -- --production

      # ── Package platform-specific .vsix ──────────────────────────────────────
      # `vsce package --target <platform>` produces a .vsix that ONLY includes
      # the bin/<platform>/ directory — all other bin/ subdirs are excluded.
      # This keeps each platform .vsix slim (~no dead binaries from other OSes).
      - name: Package platform .vsix
        working-directory: vscode-extension
        run: npm exec --no -- vsce package --target ${{ matrix.platform_key }} --no-git-tag-version --no-update-package-json

      # ── Upload .vsix artifact ─────────────────────────────────────────────────
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: andromity-${{ matrix.platform_key }}.vsix
          # glob picks up andromity-agent-<version>-<platform>.vsix
          path: vscode-extension/*.vsix
          retention-days: 30
          if-no-files-found: error

  # Publish to Open VSX after all builds pass. VS Code Marketplace publishing is manual.
  publish:
    name: Publish to Open VSX
    needs: build                         # wait for ALL platform builds to pass
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Download all platform .vsix files produced by the build matrix
      - name: Download all .vsix artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: vsix-artifacts
          pattern: "andromity-*.vsix"
          merge-multiple: true

      - name: List artifacts
        run: ls -lh vsix-artifacts/

      # Publish each platform .vsix to Open VSX Registry
      - name: Publish platform .vsix files to Open VSX
        working-directory: vsix-artifacts
        run: |
          TOKEN="${OVSX_PAT:-${OPEN_VSX_TOKEN:-$OPENVSX_TOKEN}}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::OVSX_PAT secret is not configured in repository secrets."
            echo "Skipping Open VSX publish."
          else
            for f in *.vsix; do
              echo "Publishing $f to Open VSX..."
              OVSX_PAT="$TOKEN" npx --yes ovsx@1.2.0 publish "$f"
            done
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}

