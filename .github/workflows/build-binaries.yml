name: Build Platform Binaries

# Builds andromity-server binaries for Windows, Linux, and macOS.
# Triggers on version tags (same as publish.yml) and on manual dispatch.
#
# After each run, download the per-platform artifacts from the Actions UI,
# extract them into vscode-extension/bin/<platform>/, commit, then run
# `vsce package` to produce a .vsix that bundles all binaries.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # Allow manual trigger from the GitHub UI

jobs:
  build:
    name: Build · ${{ matrix.platform_key }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false    # Build all platforms even if one fails
      matrix:
        include:
          - runner: windows-latest
            platform_key: win32-x64
            exe_name: andromity-server.exe

          - runner: ubuntu-latest
            platform_key: linux-x64
            exe_name: andromity-server

          - runner: macos-13        # GitHub's Intel runner
            platform_key: darwin-x64
            exe_name: andromity-server

          - runner: macos-latest    # GitHub's Apple Silicon (M1/M2) runner
            platform_key: darwin-arm64
            exe_name: andromity-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── uv (fast, avoids externally-managed-environment errors on Linux/macOS)
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # ── Dependencies ─────────────────────────────────────────────────────────
      # Install the project and PyInstaller into the current Python env via uv.
      # uv pip install targets the current interpreter (setup-python's Python),
      # bypassing PEP 668 "externally-managed" restrictions.
      - name: Install project and PyInstaller
        run: |
          uv pip install -e ".[dev]" --system
          uv pip install pyinstaller --system

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build binary
        run: python scripts/build-binary.py

      # ── Verify the binary was produced ───────────────────────────────────────
      - name: Verify binary exists (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN=vscode-extension/bin/${{ matrix.platform_key }}/${{ matrix.exe_name }}
          if [ ! -f "$BIN" ]; then
            echo "ERROR: Binary not found at $BIN"
            ls -la vscode-extension/bin/ || true
            exit 1
          fi
          echo "Binary size: $(du -sh "$BIN" | cut -f1)"

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "vscode-extension/bin/${{ matrix.platform_key }}/${{ matrix.exe_name }}"
          if (-not (Test-Path $bin)) {
            Write-Error "Binary not found at $bin"
            Get-ChildItem vscode-extension/bin/ -ErrorAction SilentlyContinue
            exit 1
          }
          $size = (Get-Item $bin).Length / 1MB
          Write-Output ("Binary size: {0:N1} MB" -f $size)

      # ── Upload artifact ───────────────────────────────────────────────────────
      # Uploads the entire bin/<platform>/ folder so the directory layout
      # can be directly placed at vscode-extension/bin/<platform>/ in the repo.
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: andromity-server-${{ matrix.platform_key }}
          path: vscode-extension/bin/${{ matrix.platform_key }}/
          retention-days: 30
          if-no-files-found: error
